body:
  text: 之一碑陽度蓋行佛主陳熬樂水月光佛主陳歸歡日光佛主清信邵賜好最上首佛主清信王那姿日月流璃光佛主陳洪暢妻杜容姬功德多寶佛主陳洪建淨信佛主除疑冥佛主陳黑花色王佛主清信張舍妃菩提華佛主清信荊元妃無上流璃光佛主陳洪興開日月光佛主陳洪度檀越主陳胤天定光佛主楊歡供養彌勒佛主清信陳連歡觀世音菩薩主清信杜銀祖陳文一心供養時當陽佛主陳洪波菩薩主陳天與侍佛像主比丘尼法藏敬造阿難菩薩主清信女陳妙暈阿難主清信女陳金錁德大世菩薩清信張敬姿叔祖陳艾侍藥王菩薩陳天授侍普賢菩薩無㝵光佛主清信常獨生無量光佛主清信女陳始華維衛佛主清信郭曇姿隨葉佛主清信女陳始貴伯父陳保陳市德侍鸞音佛陳封侍威神佛阿粊佛主清信令胡甑貴無量壽佛主清信女陳華蘭識佛主清信女陳始暈拘樓孫佛主清信女陳始敬陳洪淵陳憂兜法慧佛陳伯樂侍善宿佛起像主陳海龍一心侍佛保定二年歲次壬午正月壬寅朔草四日乙丑敬造夫道性空寂神照之理無源法身玄曠藏用之途不測昔如來降生維衛託體王宮發神光於清夜均有形示同生滅然比丘尼法藏體道悟真含靈自曉化及天龍教被人鬼是以知財五家謹割衣鉢之餘敬造文石像一區鐫金鏤彩妙擬釋迦丈六之容遠而望之灼如等覺之現仰為皇帝陛下群僚百官國土人民又為師徒七世父母生身父母託生兜率若遇八難速得解脫有生之類同沾福澤供養主虎牙將軍陳龍歡供養佛時齊主輔國將軍中散都督陳季標一心供養時佛息子亮隨父侍佛時齊主陳遵嶽一心侍佛時右葙都佛主持節撫軍將軍左金紫光祿大都督魏定陽令後封正平北平雉城三郡太守高陸縣開國公陳叔俊當陽像主宣威將軍虎賁給事始平開國子陳回顯供養之二碑陰須彌燈佛主李元成供養威音王佛主陳子豫供養雲雷音王佛主陳和國供養空王佛主陳曇安一心供養師子音佛主陳僧和供養憂鉢羅華光佛主陳天壽供養寶王佛主陳先俊供養佛時分身諸佛主陳慶俊思善佛主陳羅漢供養正念佛主陳僧榮供養十六王子佛主陳興和供養三万燃燈佛主呂子慎供養莊嚴光明佛主陳醜奴供養梵王佛主清信荊要娥須彌燈王佛主陳俱羅供養定光菩薩主陳僧安一心供養寶王佛主陳歸慶供養彌勒菩薩陳元俊供養迦葉菩薩清信趙醜是供養華光佛主清信陳姿歡阿難主殿中將軍強弩司馬陳蘭俊信相菩薩主清信陳法姬供養虛空藏菩薩主賈曇威賈威俊迦葉菩薩主陳惠成一心供養月像佛主清信女陳長暈金光明佛主清信張洪萎寶月佛主清信楊雙貴供養無著佛主清信元買是供養師子吼王佛主清信常金容光遠佛主橫野將軍員外司馬陳崇昕大通光佛主陳玉洋供養炎根佛主清信女朝顏暈藥王佛主陳長洋供養樓至佛主清信景可日供養無上功德佛主陳元洋供養神通自在佛主清信路明照供養像主比丘尼法藏比丘尼法訓比丘尼法暈比丘尼法妙比丘尼法喬比丘尼僧姿比丘尼道樂比丘尼姿容比丘尼僧妃比丘尼法姬比丘尼勝容比丘尼靜觀比丘尼法智比丘尼敬貴比丘尼靜粲比丘尼道化比丘尼法貞沙彌尼長暈比丘尼道清比丘尼惠藏沙彌尼志湛比丘尼道慶比丘尼智演沙彌尼惠丰比丘尼淨暈比丘尼惠好沙彌尼敬丰比丘尼法深比丘尼香積沙彌尼御親比丘尼妙音比丘尼法才比丘尼要姿比丘尼普敬比丘尼寶光比丘尼僧訓比丘尼淨志比丘尼阿貴比丘尼僧要開明主任明歡女惡女息永樂等一心供養都像主陳光勝陳真安兄弟等一心供養佛時都邑主陳延標之三兩側旁立佛主清信陳孟妃離虛垢佛主楊外榮供養寶德佛主清信薛毛王供養雲自在佛主清信張善王供養時栴檀華佛主陳覆龍一心供養迦葉菩薩主清信李進姜一心供養清信女文綵憐寶炎佛主曾口縣令陳清匡師子遊戲王佛主清信邵次男大光王佛主清信呂妙貴妙意佛主阿難主甸難將軍員外司馬隆州府法曹陳征仙甘露鼓佛主陳惠龍一心供養具足莊嚴王佛主清信張華姜主常滅佛主光炎佛主清信李婆好一心供養師子相佛主清信景難姜供養遠照光佛主陳牙女超日月光佛陳元智難思光佛主智慧光佛主梵相佛主趙回伯一心供養佛時無光佛主陳智和供養
